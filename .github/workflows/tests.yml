name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[algorithms,contextfolder,qdrant,evaluation]"
      - run: python tools/fetch_test_sources.py
      - run: python tools/check_contracts.py
      - run: python -m memfolder run examples/experiments/offline-demo.json
      - run: python -m memfolder verify build/experiments/offline-demo
      - run: python -m memfolder matrix examples/experiments/offline-matrix.json
