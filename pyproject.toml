[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memfolder"
version = "0.1.0.dev0"
description = "Composable agent memory compression planners, operators and native memory loaders"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
algorithms = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]
contextfolder = ["tiktoken>=0.8"]
qdrant = ["qdrant-client>=1.12"]
evaluation = ["nltk>=3.9"]
llmlingua2 = ["llmlingua==0.2.2"]

[project.scripts]
memfolder = "memfolder.__main__:main"

[tool.setuptools.package-dir]
memfolder = "src"

[tool.setuptools.package-data]
memfolder = ["py.typed", "licenses/*.txt"]
