[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memfolder-example-case-writer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["memfolder>=0.1.0.dev0"]

[project.entry-points."memfolder.plugins"]
"example.case-writer" = "case_writer_plugin:build"

[tool.setuptools]
py-modules = ["case_writer_plugin"]
