[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memfolder-example-newbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["memfolder>=0.1.0.dev0"]
description = "A synthetic benchmark plugin outside the MemFolder implementation"

[project.entry-points."memfolder.plugins"]
"example.newbench" = "newbench_plugin:build"

[tool.setuptools]
py-modules = ["newbench_plugin"]
