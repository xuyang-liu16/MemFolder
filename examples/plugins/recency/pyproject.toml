[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memfolder-example-recency"
version = "0.1.0"
description = "An independently installed MemFolder anchor selector"
requires-python = ">=3.11"
dependencies = ["memfolder>=0.1.0.dev0"]

[project.entry-points."memfolder.plugins"]
"example.recency" = "recency_plugin:build"

[tool.setuptools]
py-modules = ["recency_plugin"]
